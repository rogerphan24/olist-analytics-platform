version: 2

models:
  - name: stg_products
    description: "One row per product; missing source attributes remain null."
    columns:
      - name: product_id
        description: "Product identifier."
        data_tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Original Portuguese category; null and unmapped values are preserved."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_product_category_translation')
                field: product_category_name
              config:
                severity: warn

      - name: product_name_length
        description: "Name length; corrects source spelling product_name_lenght."

      - name: product_description_length
        description: "Description length; corrects source spelling product_description_lenght."

      - name: product_photos_qty
        description: "Number of product photos."

      - name: product_weight_g
        description: "Weight in grams; zero and missing source values are retained."

      - name: product_length_cm
        description: "Product length in centimetres."

      - name: product_height_cm
        description: "Product height in centimetres."

      - name: product_width_cm
        description: "Product width in centimetres."
