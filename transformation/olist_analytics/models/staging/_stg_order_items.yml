version: 2

models:
  - name: stg_order_items
    description: "One row per item within an order."

    data_tests:
      - unique:
          arguments:
            column_name: "concat(order_id, '-', cast(order_item_id as string))"

    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

      - name: shipping_limit_date
        data_tests:
          - not_null

      - name: price
        data_tests:
          - not_null

      - name: freight_value
        data_tests:
          - not_null
