version: 2

models:
  - name: fact_orders
    description: "One row per order, including item totals and delivery milestones."

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_status
        data_tests:
          - not_null

      - name: purchase_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: approved_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: carrier_delivery_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: customer_delivery_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: estimated_delivery_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: order_count
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
                quote: false

      - name: item_count
        data_tests:
          - not_null